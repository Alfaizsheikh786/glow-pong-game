    /* Overlay Modal for Revive */

<body>

  <header>
    <h1>MINIMAL ARCADE</h1>
    <p>8 Instant Retro Games & Challenges</p>
  </header>

  <div class="top-bar">
    <button class="share-btn" onclick="shareOnWhatsApp()">📲 WhatsApp Challenge</button>
  </div>

  <!-- 8 Buttons Grid -->

    <button class="menu-btn" onclick="switchGame('snake')">2. Snake</button>
    <button class="menu-btn" onclick="switchGame('ttt')">3. Tic-Tac</button>

  <div class="stage">

    <!-- REWARDED / REVIVE MODAL OVERLAY -->
    <div id="revive-modal" class="modal-overlay">
      <h2 id="modal-title" style="color:#ef4444; font-size:18px;">Game Over!</h2>

    <!-- 1. PONG -->

        <span class="p2-color"><span id="pong-p2-label">AI</span>: <span id="pong-s2">0</span></span>
      </div>
      <canvas id="pongCanvas" width="320" height="200"></canvas>
      <div class="touch-controls">
        <button class="t-btn" onpointerdown="pongP1Move=-4" onpointerup="pongP1Move=0">▲ Up</button>
        <button class="btn-start" id="pong-start-btn" onclick="startPongLoop()">▶ Start Game</button>
        <button class="t-btn" onpointerdown="pongP1Move=4" onpointerup="pongP1Move=0">▼ Down</button>
      </div>
    </div>

    <!-- 2. SNAKE -->
    <div id="game-snake" class="game-view">
      <div class="score-board">
        <span class="p1-color">Score: <span id="snake-score">0</span></span>
        <span class="best-color">Best: <span id="snake-best">0</span></span>
      </div>
      <canvas id="snakeCanvas" width="280" height="200"></canvas>
      <div style="display:grid; grid-template-columns:repeat(3,45px); gap:6px; margin-top:8px;">
        <div></div><button class="t-btn" onclick="changeSnakeDir('UP')">▲</button><div></div>
        <button class="t-btn" onclick="changeSnakeDir('LEFT')">◀</button>
        <button class="t-btn" onclick="changeSnakeDir('DOWN')">▼</button>
        <button class="t-btn" onclick="changeSnakeDir('RIGHT')">▶</button>
      </div>
      <button class="btn-start" id="snake-start-btn" onclick="startSnakeLoop()">▶ Start Game</button>
    </div>

    <!-- 3. TIC TAC TOE -->
    <div id="game-ttt" class="game-view">
      <div class="mode-bar">
        <button id="ttt-ai" class="mode-btn active" onclick="setTTTMode('ai')">🤖 Vs AI</button>
        <button id="ttt-2p" class="mode-btn" onclick="setTTTMode('2p')">👥 2 Players</button>
      </div>
      <div class="score-board" style="justify-content:center;"><span id="ttt-status" class="p1-color">Player X Turn</span></div>
      <div class="ttt-board" id="ttt-board"></div>
      <button class="btn-action" onclick="checkInterMatchAd(); resetTTT();">Restart</button>
    </div>

    <!-- 4. REACTION -->
    <div id="game-reaction" class="game-view">
      <div id="reaction-box" class="reaction-box" style="background:#ef4444;" onclick="handleReactionClick()">Tap when GREEN</div>
      <div class="score-board" style="margin-top:10px; justify-content:center;"><span class="best-color">Best: <span id="react-best">--</span> ms</span></div>
    </div>

    <!-- 5. MEMORY -->
    <div id="game-memory" class="game-view">
      <div class="score-board">
        <span class="p1-color">Moves: <span id="mem-moves">0</span></span>
        <span class="best-color">Best: <span id="mem-best">--</span></span>
      </div>
      <div class="mem-grid" id="mem-grid"></div>
      <button class="btn-action" onclick="checkInterMatchAd(); resetMemory();">New Game</button>
    </div>

    <!-- 6. BRICKS -->
    <div id="game-bricks" class="game-view">
      <div class="score-board">
        <span class="p1-color">Score: <span id="bricks-score">0</span></span>
        <span class="best-color">Best: <span id="bricks-best">0</span></span>
      </div>
      <canvas id="bricksCanvas" width="300" height="200"></canvas>
      <div class="touch-controls">
        <button class="t-btn" onpointerdown="brickPaddleMove=-5" onpointerup="brickPaddleMove=0">◀ Left</button>
        <button class="t-btn" onpointerdown="brickPaddleMove=5" onpointerup="brickPaddleMove=0">Right ▶</button>
      </div>
      <button class="btn-start" id="bricks-start-btn" onclick="startBricksLoop()">▶ Start Game</button>
    </div>

    <!-- 7. WORD GUESS -->
    <div id="game-word" class="game-view">
      <div class="score-board" style="justify-content:center;"><span class="p1-color">Guess 4-Letter Word</span></div>
      <div class="word-grid" id="word-grid"></div>
      <div id="word-msg" style="font-size:12px; color:#38bdf8; min-height:16px; margin:4px 0; font-weight:700;"></div>
      <div class="word-input-row" id="word-inputs">
        <input type="text" id="word-val" class="word-input" maxlength="4" placeholder="WORD" />
        <button class="btn-action" style="margin-top:0;" onclick="submitGuess()">Enter</button>
        <button class="btn-hint" onclick="getWordHint()">💡 Hint</button>
      </div>
      <button class="btn-action" id="word-reset-btn" style="display:none;" onclick="checkInterMatchAd(); initWordGame();">Play Again</button>
    </div>

    <!-- 8. FLAPPY DOT (Bigger Screen) -->
    <div id="game-flappy" class="game-view">
      <div class="score-board">
        <span class="p1-color">Score: <span id="flappy-score">0</span></span>
        <span class="best-color">Best: <span id="flappy-best">0</span></span>
      </div>
      <canvas id="flappyCanvas" width="320" height="300"></canvas>
      <button class="btn-start" id="flappy-start-btn" onclick="startFlappyLoop()">▶ Start Game</button>
      <button class="btn-action" id="flappy-jump-btn" style="display:none; width:100%; max-width:320px; padding:12px; font-size:14px; margin-top:8px;" onpointerdown="flap()">🚀 TAP TO JUMP</button>
    </div>

  </div>

  <script>
    /* --- DIRECT LINK SMART AD SYSTEM --- */
    const DIRECT_AD_URL = "https://omg10.com/4/11689142";
    let matchCounter = 0;
    let currentGameOverGame = null;

    function triggerDirectAd() {
      try {
        window.open(DIRECT_AD_URL, '_blank');
      } catch(e){}
    }

    function checkInterMatchAd() {
      matchCounter++;
      if (matchCounter % 3 === 0) {
        triggerDirectAd();
      }
    }

    function showGameOverModal(gameName, score) {
      currentGameOverGame = gameName;
      document.getElementById('modal-title').innerText = `${gameName.toUpperCase()} OVER!`;
      document.getElementById('modal-desc').innerText = `Current Score: ${score}`;
      document.getElementById('revive-modal').classList.add('active');
    }

    function handleReviveAction() {
      triggerDirectAd();
      document.getElementById('revive-modal').classList.remove('active');
      if (currentGameOverGame === 'snake') {
        snake = [{x: 10, y: 10}];
        sDir = 'RIGHT';
        startSnakeLoop(true);
      } else if (currentGameOverGame === 'flappy') {
        fDotY = 150;
        fVelocity = 0;
        fPipes = [{ x: 320, top: 80, bottom: 120 }];
        startFlappyLoop(true);
      }
    }

    function handleDoubleScoreAction() {
      triggerDirectAd();
      document.getElementById('revive-modal').classList.remove('active');
      if (currentGameOverGame === 'snake') {
        sScore = sScore * 2;
        document.getElementById('snake-score').innerText = sScore;
        if (sScore > sBest) { sBest = sScore; localStorage.setItem('snake_best', sBest); document.getElementById('snake-best').innerText = sBest; }
      } else if (currentGameOverGame === 'flappy') {
        fScore = fScore * 2;
        document.getElementById('flappy-score').innerText = fScore;
        if (fScore > fBest) { fBest = fScore; localStorage.setItem('flappy_best', fBest); document.getElementById('flappy-best').innerText = fBest; }
      }
      closeModalAndRestart();
    }

    function closeModalAndRestart() {
      document.getElementById('revive-modal').classList.remove('active');
      checkInterMatchAd();
      if (currentGameOverGame === 'snake') renderInitialSnake();
      if (currentGameOverGame === 'flappy') renderInitialFlappy();
    }

    /* --- BEEP SOUND ENGINE --- */
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playBeep(freq = 440, type = 'sine', duration = 0.08) {
      try {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type; osc.frequency.value = freq;
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start(); osc.stop(audioCtx.currentTime + duration);
      } catch(e){}
    }

    /* --- SHARE BUTTON --- */
    function shareOnWhatsApp() {
      let url = window.location.href;
      let text = encodeURIComponent(`🔥 Maine Minimal Arcade me naye records banaye! Kya tum mujhe hara sakte ho? Khel ke dekho: ${url}`);
      window.open(`https://api.whatsapp.com/send?text=${text}`, '_blank');
    }

    /* --- GAME SWITCHER --- */
    let activeTab = 'pong';
    function switchGame(name) {
      activeTab = name;
      document.querySelectorAll('.game-view').forEach(v => v.classList.remove('active'));
      document.querySelectorAll('.menu-btn').forEach(b => b.classList.remove('active'));
      let target = document.getElementById('game-' + name);
      if(target) target.classList.add('active');
      if(event && event.target) event.target.classList.add('active');

      clearInterval(pongInt); clearInterval(sInt); clearInterval(bricksInt); clearInterval(flappyInt);

      if(name === 'pong') renderInitialPong();
      if(name === 'snake') renderInitialSnake();
      if(name === 'bricks') renderInitialBricks();
      if(name === 'word') initWordGame();
      if(name === 'flappy') renderInitialFlappy();
    }

    /* --- 1. PONG --- */
    let pongCanvas = document.getElementById('pongCanvas'), pctx = pongCanvas.getContext('2d');
    let p1Y = 70, p2Y = 70, bx = 160, by = 100, bvx = 3, bvy = 2, ps1 = 0, ps2 = 0, pongP1Move = 0, pongMode = 'ai', pongInt, pongRunning = false;
    
    function setPongMode(m){ pongMode = m; document.getElementById('pong-ai').classList.toggle('active', m==='ai'); document.getElementById('pong-2p').classList.toggle('active', m==='2p'); document.getElementById('pong-p2-label').innerText = m==='ai'?'AI':'P2'; }
    
    function renderInitialPong() {
      pongRunning = false;
      document.getElementById('pong-start-btn').style.display = 'inline-block';
      pctx.fillStyle = '#020617'; pctx.fillRect(0,0,320,200);
      pctx.fillStyle = '#22c55e'; pctx.fillRect(10, 70, 8, 50);
      pctx.fillStyle = '#ef4444'; pctx.fillRect(302, 70, 8, 50);
      pctx.fillStyle = '#eab308'; pctx.fillRect(156, 96, 8, 8);
    }

    function startPongLoop() {
      document.getElementById('pong-start-btn').style.display = 'none';
      pongRunning = true;
      resetBall();
      clearInterval(pongInt);
      pongInt = setInterval(() => {
        if(activeTab !== 'pong' || !pongRunning) return;
        p1Y = Math.max(0, Math.min(150, p1Y + pongP1Move));
        if(pongMode === 'ai') p2Y += (by - (p2Y + 25)) * 0.1;
        bx += bvx; by += bvy;
        if(by <= 5 || by >= 195) { bvy = -bvy; playBeep(300); }
        if(bx <= 20 && by >= p1Y && by <= p1Y+50) { bvx = -bvx * 1.05; playBeep(520); }
        if(bx >= 300 && by >= p2Y && by <= p2Y+50) { bvx = -bvx * 1.05; playBeep(520); }
        if(bx < 0){ ps2++; playBeep(180, 'sawtooth'); resetBall(); }
        if(bx > 320){ ps1++; playBeep(650); resetBall(); }
        document.getElementById('pong-s1').innerText = ps1;
        document.getElementById('pong-s2').innerText = ps2;
        pctx.fillStyle = '#020617'; pctx.fillRect(0,0,320,200);
        pctx.fillStyle = '#22c55e'; pctx.fillRect(10, p1Y, 8, 50);
        pctx.fillStyle = '#ef4444'; pctx.fillRect(302, p2Y, 8, 50);
        pctx.fillStyle = '#eab308'; pctx.fillRect(bx-4, by-4, 8, 8);
      }, 1000/60);
    }
    function resetBall(){ bx=160; by=100; bvx = (Math.random()>0.5?3:-3); bvy = (Math.random()>0.5?2:-2); }

    /* --- 2. SNAKE --- */
    let sCanvas = document.getElementById('snakeCanvas'), sctx = sCanvas.getContext('2d');
    let snake = [{x:5,y:5}], sDir = 'RIGHT', sFood = {x:10,y:10}, sScore = 0, sInt;
    let sBest = localStorage.getItem('snake_best') || 0;
    document.getElementById('snake-best').innerText = sBest;

    function renderInitialSnake() {
      clearInterval(sInt);
      document.getElementById('snake-start-btn').style.display = 'inline-block';
      sctx.fillStyle='#020617'; sctx.fillRect(0,0,280,200);
      sctx.fillStyle='#22c55e'; sctx.fillRect(50, 50, 9, 9);
    }

    function startSnakeLoop(isRevive = false){
      document.getElementById('snake-start-btn').style.display = 'none';
      clearInterval(sInt);
      if(!isRevive) {
        snake = [{x:5,y:5}];
        sScore = 0;
        sDir = 'RIGHT';
        document.getElementById('snake-score').innerText = 0;
      }
      sInt = setInterval(() => {
        if(activeTab !== 'snake') return;
        let head = {...snake[0]};
        if(sDir==='UP') head.y--; if(sDir==='DOWN') head.y++; if(sDir==='LEFT') head.x--; if(sDir==='RIGHT') head.x++;
        if(head.x<0||head.x>=28||head.y<0||head.y>=20||snake.some(s=>s.x===head.x&&s.y===head.y)){
          playBeep(150, 'sawtooth', 0.2);
          clearInterval(sInt);
          if(sScore > sBest){ sBest = sScore; localStorage.setItem('snake_best', sBest); document.getElementById('snake-best').innerText = sBest; }
          showGameOverModal('snake', sScore);
          return;
        }
        snake.unshift(head);
        if(head.x===sFood.x && head.y===sFood.y){
          playBeep(700); sScore+=10; document.getElementById('snake-score').innerText=sScore;
          sFood={x:Math.floor(Math.random()*28),y:Math.floor(Math.random()*20)};
        } else snake.pop();
        sctx.fillStyle='#020617'; sctx.fillRect(0,0,280,200);
        sctx.fillStyle='#ef4444'; sctx.fillRect(sFood.x*10, sFood.y*10, 9, 9);
        sctx.fillStyle='#22c55e'; snake.forEach(s=>sctx.fillRect(s.x*10, s.y*10, 9, 9));
      }, 100);
    }
    function changeSnakeDir(d){ playBeep(400); if(d==='UP'&&sDir!=='DOWN') sDir='UP'; if(d==='DOWN'&&sDir!=='UP') sDir='DOWN'; if(d==='LEFT'&&sDir!=='RIGHT') sDir='LEFT'; if(d==='RIGHT'&&sDir!=='LEFT') sDir='RIGHT'; }

    /* --- 3. TIC TAC TOE --- */
    let tttGrid = Array(9).fill(null), tttTurn = 'X', tttMode = 'ai';
    function setTTTMode(m){ tttMode=m; document.getElementById('ttt-ai').classList.toggle('active',m==='ai'); document.getElementById('ttt-2p').classList.toggle('active',m==='2p'); resetTTT(); }
    function resetTTT(){
      tttGrid.fill(null); tttTurn='X'; document.getElementById('ttt-status').innerText="Player X Turn";
      let board = document.getElementById('ttt-board'); board.innerHTML='';
      for(let i=0;i<9;i++){ let c = document.createElement('div'); c.className='ttt-cell'; c.onclick=()=>makeTTTMove(i); board.appendChild(c); }
    }
    function makeTTTMove(i){
      if(tttGrid[i] || checkTTTWinner()) return;
      playBeep(tttTurn==='X'?500:600);
      tttGrid[i] = tttTurn; updateTTTUI();
      if(checkTTTWinner()){ playBeep(800,'triangle',0.3); document.getElementById('ttt-status').innerText=`${tttTurn} Won! 🎉`; checkInterMatchAd(); return; }
      if(!tttGrid.includes(null)){ document.getElementById('ttt-status').innerText="Draw! 🤝"; checkInterMatchAd(); return; }
      tttTurn = tttTurn === 'X' ? 'O' : 'X';
      document.getElementById('ttt-status').innerText = `${tttTurn} Turn`;
      if(tttMode==='ai' && tttTurn==='O'){ setTimeout(()=>{ let empty = tttGrid.map((v,idx)=>v===null?idx:null).filter(v=>v!==null); if(empty.length) makeTTTMove(empty[Math.floor(Math.random()*empty.length)]); }, 250); }
    }
    function updateTTTUI(){ let cells = document.querySelectorAll('.ttt-cell'); tttGrid.forEach((v,i)=>{ cells[i].innerText = v||''; cells[i].className = 'ttt-cell ' + (v?v.toLowerCase():''); }); }
    function checkTTTWinner(){
      const wins = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
      return wins.some(([a,b,c]) => tttGrid[a] && tttGrid[a] === tttGrid[b] && tttGrid[a] === tttGrid[c]);
    }
    resetTTT();

    /* --- 4. REACTION TIME --- */
    let reactBox = document.getElementById('reaction-box'), reactTimer, startTime, readyForClick = false;
    let reactBest = localStorage.getItem('react_best') || '--';
    document.getElementById('react-best').innerText = reactBest;
    function startReactionGame(){
      readyForClick = false; reactBox.style.background = '#ef4444'; reactBox.innerText = 'Wait for GREEN...';
      reactTimer = setTimeout(()=>{ reactBox.style.background = '#22c55e'; reactBox.innerText = 'CLICK NOW!'; startTime = Date.now(); readyForClick = true; playBeep(600); }, Math.random()*2500 + 1500);
    }
    function handleReactionClick(){
      if(!readyForClick){ clearTimeout(reactTimer); reactBox.innerText = 'Too early! Tap to retry'; playBeep(180,'sawtooth'); setTimeout(startReactionGame, 1200); }
      else {
        let diff = Date.now() - startTime; reactBox.style.background = '#38bdf8'; reactBox.innerText = `${diff} ms! Tap to retry`; readyForClick = false; playBeep(750);
        if(reactBest === '--' || diff < parseInt(reactBest)){ reactBest = diff; localStorage.setItem('react_best', reactBest); document.getElementById('react-best').innerText = reactBest; }
        checkInterMatchAd();
      }
    }
    startReactionGame();

    /* --- 5. MEMORY PUZZLE --- */
    const memIcons = ['⭐','⭐','💎','💎','🚀','🚀','🔥','🔥','⚡','⚡','🎮','🎮'];
    let memCards = [], flipped = [], moves = 0;
    let memBest = localStorage.getItem('mem_best') || '--';
    document.getElementById('mem-best').innerText = memBest;
    function resetMemory(){
      memCards = [...memIcons].sort(()=>Math.random()-0.5);
      flipped = []; moves = 0; document.getElementById('mem-moves').innerText = 0;
      let grid = document.getElementById('mem-grid'); grid.innerHTML = '';
      memCards.forEach((icon, i)=>{
        let c = document.createElement('div'); c.className = 'mem-card'; c.onclick = ()=>flipCard(c, icon);
        grid.appendChild(c);
      });
    }
    function flipCard(el, val){
      if(flipped.length >= 2 || el.classList.contains('flipped')) return;
      playBeep(450);
      el.innerText = val; el.classList.add('flipped'); flipped.push({el, val});
      if(flipped.length === 2){
        moves++; document.getElementById('mem-moves').innerText = moves;
        if(flipped[0].val === flipped[1].val){
          playBeep(700); flipped = [];
          if(document.querySelectorAll('.mem-card.flipped').length === 12){
            if(memBest === '--' || moves < parseInt(memBest)){ memBest = moves; localStorage.setItem('mem_best', memBest); document.getElementById('mem-best').innerText = memBest; }
            checkInterMatchAd();
          }
        } else { setTimeout(()=>{ flipped.forEach(f=>{ f.el.innerText=''; f.el.classList.remove('flipped'); }); flipped=[]; }, 600); }
      }
    }
    resetMemory();

    /* --- 6. BRICKS BREAKER --- */
    let bCanvas = document.getElementById('bricksCanvas'), bctx = bCanvas.getContext('2d');
    let bpX = 120, brickPaddleMove = 0, bbX = 150, bbY = 160, bbVx = 2.5, bbVy = -2.5, bScore = 0, bBricks = [], bricksInt;
    let bBest = localStorage.getItem('bricks_best') || 0;
    document.getElementById('bricks-best').innerText = bBest;

    function renderInitialBricks() {
      clearInterval(bricksInt);
      document.getElementById('bricks-start-btn').style.display = 'inline-block';
      bctx.fillStyle = '#020617'; bctx.fillRect(0,0,300,200);
      bctx.fillStyle = '#38bdf8'; bctx.fillRect(120, 185, 60, 8);
      bctx.fillStyle = '#eab308'; bctx.fillRect(146, 156, 8, 8);
    }

    function startBricksLoop(){
      document.getElementById('bricks-start-btn').style.display = 'none';
      clearInterval(bricksInt); bScore = 0; bpX = 120; bbX = 150; bbY = 160; bbVx = 2.5; bbVy = -2.5;
      document.getElementById('bricks-score').innerText = 0;
      bBricks = [];
      for(let r=0; r<3; r++){ for(let c=0; c<6; c++){ bBricks.push({x: c*48 + 8, y: r*18 + 15, alive: true}); } }
      bricksInt = setInterval(()=>{
        if(activeTab !== 'bricks') return;
        bpX = Math.max(0, Math.min(240, bpX + brickPaddleMove));
        bbX += bbVx; bbY += bbVy;
        if(bbX <= 4 || bbX >= 296) { bbVx = -bbVx; playBeep(320); }
        if(bbY <= 4) { bbVy = -bbVy; playBeep(320); }
        if(bbY >= 180 && bbX >= bpX && bbX <= bpX + 60) { bbVy = -Math.abs(bbVy); playBeep(520); }
        if(bbY > 200){
          playBeep(180, 'sawtooth');
          if(bScore > bBest){ bBest = bScore; localStorage.setItem('bricks_best', bBest); document.getElementById('bricks-best').innerText = bBest; }
          renderInitialBricks(); return;
        }
        bBricks.forEach(b=>{
          if(b.alive && bbX >= b.x && bbX <= b.x + 44 && bbY >= b.y && bbY <= b.y + 14){
            b.alive = false; bbVy = -bbVy; bScore += 10; playBeep(650);
            document.getElementById('bricks-score').innerText = bScore;
          }
        });
        bctx.fillStyle = '#020617'; bctx.fillRect(0,0,300,200);
        bctx.fillStyle = '#38bdf8'; bctx.fillRect(bpX, 185, 60, 8);
        bctx.fillStyle = '#eab308'; bctx.fillRect(bbX-4, bbY-4, 8, 8);
        bBricks.forEach(b=>{ if(b.alive){ bctx.fillStyle = '#f43f5e'; bctx.fillRect(b.x, b.y, 44, 14); } });
      }, 1000/60);
    }

    /* --- 7. WORD GUESS GAME --- */
    const wordList = ["PLAY", "GAME", "CODE", "FIRE", "STAR", "NEON", "FAST", "JUMP", "HERO", "COOL", "MOON", "BALL"];
    let secretWord = "", wordRow = 0, maxTries = 4, wordGameOver = false;
    function initWordGame() {
      secretWord = wordList[Math.floor(Math.random() * wordList.length)];
      wordRow = 0; wordGameOver = false;
      document.getElementById('word-msg').innerText = '';
      let input = document.getElementById('word-val');
      if(input){ input.value = ''; input.disabled = false; }
      document.getElementById('word-inputs').style.display = 'flex';
      document.getElementById('word-reset-btn').style.display = 'none';

      let grid = document.getElementById('word-grid');
      grid.innerHTML = '';
      for (let r = 0; r < maxTries; r++) {
        let rowDiv = document.createElement('div');
        rowDiv.className = 'word-row';
        for (let c = 0; c < 4; c++) {
          let tile = document.createElement('div');
          tile.className = 'word-tile';
          tile.id = `tile-${r}-${c}`;
          rowDiv.appendChild(tile);
        }
        grid.appendChild(rowDiv);
      }
    }
    function submitGuess() {
      if (wordGameOver) return;
      let input = document.getElementById('word-val');
      let guess = input.value.trim().toUpperCase();
      let msg = document.getElementById('word-msg');
      if (guess.length !== 4) { msg.innerText = 'Must be 4 letters!'; playBeep(200,'sawtooth'); return; }
      msg.innerText = '';
      for (let i = 0; i < 4; i++) {
        let tile = document.getElementById(`tile-${wordRow}-${i}`);
        tile.innerText = guess[i];
        if (guess[i] === secretWord[i]) tile.classList.add('correct');
        else if (secretWord.includes(guess[i])) tile.classList.add('present');
        else tile.classList.add('absent');
      }
      if (guess === secretWord) {
        msg.innerText = '🎉 Correct Guess!'; playBeep(850, 'triangle', 0.4);
        endWordGame(); return;
      }
      playBeep(400);
      wordRow++; input.value = '';
      if (wordRow >= maxTries) { msg.innerText = `Game Over! Word was: ${secretWord}`; playBeep(180,'sawtooth',0.3); endWordGame(); }
    }
    function getWordHint() {
      if(wordGameOver) return;
      triggerDirectAd();
      document.getElementById('word-msg').innerText = `💡 Hint: First letter is '${secretWord[0]}'`;
      playBeep(600);
    }
    function endWordGame() {
      wordGameOver = true;
      document.getElementById('word-val').disabled = true;
      document.getElementById('word-reset-btn').style.display = 'inline-block';
    }

    /* --- 8. FLAPPY DOT (Bigger Canvas 320x300) --- */
    let fCanvas = document.getElementById('flappyCanvas'), fctx = fCanvas.getContext('2d');
    let fDotY = 150, fVelocity = 0, fPipes = [], fScore = 0, flappyInt;
    let fBest = localStorage.getItem('flappy_best') || 0;
    document.getElementById('flappy-best').innerText = fBest;

    function renderInitialFlappy() {
      clearInterval(flappyInt);
      document.getElementById('flappy-start-btn').style.display = 'inline-block';
      document.getElementById('flappy-jump-btn').style.display = 'none';
      fctx.fillStyle = '#020617'; fctx.fillRect(0,0,320,300);
      fctx.fillStyle = '#38bdf8';
      fctx.beginPath(); fctx.arc(40, 150, 8, 0, Math.PI * 2); fctx.fill();
    }

    function startFlappyLoop(isRevive = false) {
      document.getElementById('flappy-start-btn').style.display = 'none';
      document.getElementById('flappy-jump-btn').style.display = 'block';
      clearInterval(flappyInt);
      if(!isRevive) {
        fDotY = 150; fVelocity = 0; fScore = 0; fPipes = [];
        document.getElementById('flappy-score').innerText = 0;
        fPipes.push({ x: 320, top: 90, bottom: 120 });
      }

      flappyInt = setInterval(() => {
        if(activeTab !== 'flappy') return;
        fVelocity += 0.28; fDotY += fVelocity;

        fPipes.forEach(p => {
          p.x -= 2;
          if(p.x < 50 && p.x > 20) {
            if(fDotY - 8 < p.top || fDotY + 8 > 300 - p.bottom) { gameOverFlappy(); }
          }
          if(p.x === 20) {
            fScore++; playBeep(680);
            document.getElementById('flappy-score').innerText = fScore;
          }
        });

        if(fDotY <= 6 || fDotY >= 294) { gameOverFlappy(); }
        if(fPipes.length && fPipes[0].x < -30) {
          fPipes.shift();
          let topH = Math.floor(Math.random() * 110) + 40;
          fPipes.push({ x: 320, top: topH, bottom: 300 - topH - 90 });
        }

        fctx.fillStyle = '#020617'; fctx.fillRect(0,0,320,300);
        fctx.fillStyle = '#22c55e';
        fPipes.forEach(p => {
          fctx.fillRect(p.x, 0, 26, p.top);
          fctx.fillRect(p.x, 300 - p.bottom, 26, p.bottom);
        });
        fctx.fillStyle = '#38bdf8';
        fctx.beginPath(); fctx.arc(40, fDotY, 8, 0, Math.PI * 2); fctx.fill();
      }, 1000/60);
    }
    function flap() { fVelocity = -4.8; playBeep(450); }
    function gameOverFlappy() {
      playBeep(180, 'sawtooth', 0.25);
      clearInterval(flappyInt);
      if(fScore > fBest) { fBest = fScore; localStorage.setItem('flappy_best', fBest); document.getElementById('flappy-best').innerText = fBest; }
      showGameOverModal('flappy', fScore);
    }

    // Default Load Initial States
    renderInitialPong();
    initWordGame();
  </script>
